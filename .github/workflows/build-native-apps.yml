name: Build Native Apps (Windows, macOS, Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Workspace & Desktop Dependencies
        run: npm install --legacy-peer-deps && npm --prefix apps/desktop install
      - name: Build Windows EXE & Portable
        env:
          POS_API_URL: https://ollaibooks.onrender.com/api/v1
          NEXT_PUBLIC_API_URL: https://ollaibooks.onrender.com/api/v1
        run: npm --prefix apps/desktop run build:win
      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/desktop/dist/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Workspace & Desktop Dependencies
        run: npm install --legacy-peer-deps && npm --prefix apps/desktop install
      - name: Build macOS DMG
        env:
          POS_API_URL: https://ollaibooks.onrender.com/api/v1
          NEXT_PUBLIC_API_URL: https://ollaibooks.onrender.com/api/v1
        run: npm --prefix apps/desktop run build:mac
      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: apps/desktop/dist/*.dmg

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Capacitor
        run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
      - name: Add & Sync Android Project
        run: |
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android
      - name: Build Android APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew --init-script ../scripts/android-kotlin-dependencies.gradle assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ollaiBooks-POS.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ollaiBooks-POS.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Capacitor iOS
        run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7
      - name: Add & Sync iOS Project
        run: |
          # `cap add` runs `pod install`, which can fail if the template's iOS target
          # is lower than the Capacitor pod needs; we fix the target and sync below.
          if [ ! -d "ios" ]; then npx cap add ios || true; fi
          # Use the minimum iOS version declared by the installed Capacitor pod.
          IOS_TARGET=$(grep -Eo "ios\.deployment_target *= *'[0-9.]+'|platform *= *:ios, *'[0-9.]+'" node_modules/@capacitor/ios/Capacitor.podspec | grep -Eo "[0-9]+(\.[0-9]+)?" | head -1)
          IOS_TARGET=${IOS_TARGET:-15.0}
          echo "Using iOS deployment target $IOS_TARGET"
          sed -i '' -E "s/^platform :ios, .*/platform :ios, '$IOS_TARGET'/" ios/App/Podfile
          sed -i '' -E "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = $IOS_TARGET;/g" ios/App/App.xcodeproj/project.pbxproj
          npx cap sync ios
      - name: Build Unsigned iOS IPA
        run: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          else
            xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -archivePath build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          fi
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          (cd build && zip -r ../ollaiBooks-POS-unsigned.ipa Payload)
      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ollaiBooks-POS-unsigned.ipa

  publish-release:
    needs: [build-windows, build-macos, build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
          name: ollaiBooks POS Native Releases
          files: |
            artifacts/windows-installer/*.exe
            artifacts/macos-installer/*.dmg
            artifacts/android-apk/*.apk
            artifacts/ios-ipa/*.ipa
