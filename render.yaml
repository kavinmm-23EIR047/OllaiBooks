services:
  - type: web
    name: ollaibooks-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DISABLE_REDIS
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AK_ADMIN_SERVICE_KEY
        generateValue: true
      - key: INTEGRATION_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_ID
        value: ollaibooks-admin
      - key: ADMIN_PASSWORD
        sync: false
